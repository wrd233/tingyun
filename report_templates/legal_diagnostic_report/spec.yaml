report_type_id: legal_diagnostic_report
report_type_name: 法务系统巡检与排查报告
version: 0.2.0
renderer_entry: report_templates/renderers/render_report_instance.py
output_format:
  primary: latex
  optional:
    - pdf
    - docx
target_audience:
  - 业主技术部门
  - 开发商实施与排障团队
  - 诊断执行与复核人员
diagnostics_source_root: artifacts/monitored_systems/<system_key>/<batch_key>/diagnostics
direct_read_mode: true
report_instance_root: artifacts/monitored_systems/<system_key>/<batch_key>/reports/<report_type_id>
report_config_path: artifacts/monitored_systems/<system_key>/<batch_key>/reports/<report_type_id>/report_config.yaml
required_assets:
  - 02_master_tables/request_master.csv
  - 02_master_tables/sql_master.csv
  - 03_evidence_indexes/request_evidence_index.csv
  - 03_evidence_indexes/sql_evidence_index.csv
optional_assets:
  - 01_prepared_tables/
  - 04_deep_dive/
  - ../report_materials/
  - ../../../../../knowledge/monitored_systems/<system_key>/
chapter_tree:
  "1":
    title: 概述
    sections:
      "1.1": 巡检对象与时间范围
      "1.2": 证据来源与分析口径
  "2":
    title: 系统运行现状与性能问题分析
    sections:
      "2.1":
        title: 部署架构与运行环境概况
        children:
          "2.1.1": 系统规模总览
          "2.1.2": 服务器资源与主机分布
          "2.1.3": 服务与端口部署情况
      "2.2":
        title: 系统接口检查
        children:
          "2.2.1": 平均响应时间高的慢接口
          "2.2.2": 访问量高且响应时间差的重点接口
          "2.2.3": 平均错误率高的异常接口
          "2.2.4": 访问量高且错误率高的重点接口
      "2.3":
        title: 系统SQL检查
        children:
          "2.3.1": 系统数据库整体检查
          "2.3.2": 慢SQL检查
          "2.3.3": 异常SQL检查
  "3":
    title: 结论
chapter_order:
  - "1"
  - "2"
  - "3"
required_sections:
  - "1.1"
  - "2.2.1"
  - "2.2.2"
  - "2.2.3"
  - "2.2.4"
  - "2.3.1"
  - "2.3.2"
  - "2.3.3"
rendering_rules:
  direct_read_from_diagnostics: true
  forbid_report_input_bundle: true
  keep_template_layout_stable: true
  config_path_mode: repo_relative
  prefer_master_tables_for_ranked_objects: true
  prefer_evidence_indexes_for_status_and_screenshot_plans: true
  allow_deep_dive_as_supporting_detail: true
  preserve_manual_editability: true
  produce_minimal_generated_skeleton: true
  default_generated_outputs:
    - report_context.json
    - chapter_stubs.json
    - assembled_main.tex
    - asset_index_stub.json
    - missing_data_report.md
  default_output_outputs:
    - legal_diagnostic_report.tex
    - build_status.json
    - legal_diagnostic_report.pdf
  latex_strategy:
    keep_main_template: true
    use_light_fragments: true
    fragment_policy: cover_toc_and_major_chapters
    compile_fallback: docker_texlive_if_host_xelatex_missing
missing_data_policy:
  required_asset_missing: emit_explicit_placeholder
  optional_asset_missing: skip_with_note
  forbid_model_guessing: true
  screenshot_missing: keep_placeholder_caption_only
  sql_or_trace_url_missing: record_recoverable_gap_with_selector
