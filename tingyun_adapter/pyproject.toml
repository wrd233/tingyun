[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tingyun-adapter"
version = "0.1.0"
description = "Adapter layer for structuring Tingyun API data into analysis-oriented packs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "websockets>=12.0,<16.0",
]

[project.scripts]
tingyun-adapter = "tingyun_adapter.invocation.cli:main"
tingyun-adapter-service = "tingyun_adapter.service.http_api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
