[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tingyun-adapter-client"
version = "0.1.0"
description = "Remote client for calling a Tingyun adapter service from machine B."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["xlrd>=2.0,<3"]

[project.scripts]
tingyun-adapter-client = "tingyun_adapter_client.cli:main"
tingyun-prepare-master-table-inputs = "tingyun_adapter_client.prepare_master_table_inputs:main"
tingyun-materialize-master-tables = "tingyun_adapter_client.materialize_master_tables:main"
tingyun-materialize-deep-dive = "tingyun_adapter_client.materialize_deep_dive:main"
tingyun-export-component-analysis-raw = "tingyun_adapter_client.component_analysis_exports:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
